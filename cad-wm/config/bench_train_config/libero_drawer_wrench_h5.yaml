# Run from cad-wm: python -m train.trainer.cad_wm_train -c <this file>
# CAD-WM: motion/torque LSTM conditions, wrench flow and NEXT auxiliary task.
# Input and output use consecutive native 20 Hz HDF5 rows.
dataloader:
  backend: h5
  # Relative to cad-wm, independent of the launcher's working directory.
  root: ../dataset/wm_data/KITCHEN_SCENE1_open_the_top_drawer_of_the_cabinet_and_put_the_bowl_in_it_demo_wrench_with_dq_tau.hdf5
  h5_episode_group: data
  h5_fields:
    q:
      path: obs/joint_states
    dq:
      path: obs/dq
      columns: [0, 1, 2, 3, 4, 5, 6]
    tau:
      path: obs/tau
      columns: [0, 1, 2, 3, 4, 5, 6]
    wrench:
      path: obs/wrenches
  high_fps: 20
  state_history_horizon: 10
  pad_history: true
  # Eight future rows at t+[.05,.10,.15,.20,.25,.30,.35,.40] seconds.
  # Future wrench and contact labels come directly from t+1 through t+8.
  prediction_horizon: 8
  normalize_mode: gaussian
  normalize_lowdim_keys: [q, dq, tau, wrench]

contact_gate:
  # Use raw force XYZ, not joint torque or normalized wrench.
  metric: force_xyz_l2
  label_mode: three_phase
  free_threshold: 8.0
  contact_threshold: 8.0
  contact_enter_frames: 5
  contact_exit_frames: 5
  # Offline labels: strict > enters, strict < exits; equality holds state.
  # Confirmed entry/exit windows are backfilled to their first native frame.
  # Confirmation counts native H5 frames (5 frames = 0.25 s at 20 Hz).
  precontact_seconds: 1.0
  class_weights: [1.0, 1.0, 1.0]

model:
  implementation: model.cad_wm.CADWorldModel
  inputs: [q, dq, tau]
  outputs: [wrench]
  joint_dim: 7
  hidden_dim: 128
  lstm_layers: 2
  flow_layers: 4
  free_dynamics_hidden_dim: 128
  flow_inference_steps: 8
  flow_solver: heun
  attention_heads: 4
  ffn_multiplier: 4
  dropout: 0.01

loss:
  # Conditional flow matching + future phase CE + current free-space tau MSE.
  contact_weight: 0.1
  free_dynamics_weight: 0.1

train:
  device: cuda:0
  downsample: false
  dataset_on_device: false
  batch_size: 128
  num_workers: 0
  val_num_workers: 0
  pin_memory: true
  max_optimizer_steps: 100000
  num_epochs: 1000000
  checkpoint_every_steps: 10000
  # Evaluate at val_every epochs and at each save; retain the lowest physical MSE.
  checkpoint_eval:
    enabled: true
    batch_size: 128
    seed: 42
  # Use all demos for training. Set true to enable the split configured below.
  validation_enabled: false
  # Split settings only apply when validation_enabled is true.
  split_mode: episode
  val_ratio: 0.1
  # Full-dataset MSE every N completed epochs, even with validation disabled.
  val_every: 20
  # Refresh PNGs every N optimizer steps, and after every epoch/evaluation.
  plot_every_steps: 100
  seed: 42
  validation_seed: 42
  contact_sampling:
    enabled: true
    # Weights for free / pre-contact / contact windows.
    phase_weights: [1.0, 5.0, 5.0]
    future_phase_reduction: max
    # False intentionally emphasizes pre-contact/contact in the training objective.
    importance_correction: false
  lr: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
  amp:
    enabled: true
    dtype: bfloat16
  ema:
    enabled: true
    decay: 0.999
    use_for_validation: true
  scheduler:
    name: cosine
    warmup_steps: 500
    eta_min: 0.000001
  early_stopping:
    enabled: false
    patience: 20
    warmup_epochs: 20
    min_delta: 0.000001
  output_dir: outputs/cad_wm
  monitor_key: full_dataset_wrench_mse
  top_k: 3
  save_latest_checkpoint: true
  wandb:
    enabled: false
