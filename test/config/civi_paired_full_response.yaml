# Independent diagnostic only; no production configuration inherits this file.
name: civi_paired_full_response
seed: 42
steps: 300
microbatch: 3
validation_batch: 16
validation_every: 100
log_every: 25
gradient_every: 100
train_adapter: true
contact_windows: 12
free_windows: 6
response_rms_threshold: 0.14375167898833752
lambda_response: 1.0
# Fixed once from initial full trainable-parameter gradient norms.
delta_gradient_fraction: 0.5
zero_gradient_fraction: 0.25
free_gradient_fraction: 0.25
# Measured once by the preflight on the same D initialization and 12 windows.
# Pin these across all groups instead of recalibrating from validation results.
calibrated_coefficients:
  delta: 0.30295142555841653
  zero: 4.091764936132603
  free: 3.5999307681612986
optimizer:
  lr: 0.0002
  weight_decay: 0.0001
  betas: [0.9, 0.999]
max_gradient_norm: 1.0
starting_checkpoint: review_1000/c_mlp_checkpoint_1000.ckpt
groups:
  a: {paired_response: false, contact_zero_protection: false}
  b: {paired_response: true, contact_zero_protection: false}
  c: {paired_response: true, contact_zero_protection: true}
