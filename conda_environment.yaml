name: fdp
channels:
  - conda-forge
dependencies:
  # Match nero_ws/environment.yml so collection and training agree on array,
  # HDF5, camera, and dynamics ABI boundaries.
  - python=3.10
  - pip
  - numpy>=2.2,<2.3
  - pandas>=2.2,<3
  - h5py>=3.11
  - pyyaml>=6.0
  - opencv>=4.9,<4.13
  # Keep C++ runtime libraries inside the environment for binary wheels
  # (OpenCV, MuJoCo, and related packages).
  - libstdcxx-ng>=14
  - libgcc-ng>=14
  - matplotlib>=3.7
  - mujoco>=3.3,<4
  - pinocchio>=3,<4
  - scipy>=1.10,<1.16
  - pip:
      - -e .[training,test]
      # LeRobot v3 dataset IO used by the training configs.
      - lerobot==0.4.0
