# Shared 25 Hz xArm clean-data settings; select a task-specific config to train.
defaults:
  - train_civi_teacher
  - _self_

name: train_civi_teacher_xarm_clean
exp_name: ${name}
dataset_path: null
task_name: ${task.name}
# Thresholds label confirmed contact; the network reads unthresholded torque.
free_threshold: 12.5
contact_threshold: 12.5
contact_norm: l1

shape_meta:
  obs:
    wrist:
      shape: [3, 224, 224]
      type: rgb
    side:
      shape: [3, 224, 224]
      type: rgb
    tau_ext:
      shape: [8, 7]
      type: low_dim
  action:
    shape: [7]

policy:
  shape_meta: ${shape_meta}
  action_representation: joint_position
  relative_pose_actions: false
  free_threshold: 12.5
  contact_threshold: 12.5
  contact_norm: l1

dataloader:
  batch_size: 64
val_dataloader:
  batch_size: 64

training:
  num_epochs: null
  num_optimizer_steps: 200000
  distributed:
    enabled: false

task:
  name: xarm_clean_25hz
  free_threshold: 12.5
  contact_threshold: 12.5
  contact_norm: l1
  phase_source_key: observation.tau_ext_unthresholded
  image_shape: [3, 224, 224]
  shape_meta: ${shape_meta}
  dataset:
    shape_meta: ${shape_meta}
    dataset_path: ${dataset_path}
    image_feature_map:
      side: observation.images.front
      wrist: observation.images.right_wrist
    action_feature_fields: [action.joint]
    # Null removes the inherited LIBERO gripper-column selection completely.
    action_feature_columns: null
    action_feature_offsets: null
    relative_pose_actions: false
    timestamp_step_sec: 0.04
    observation_validity_key: null
    contact_threshold: 12.5
    contact_norm: l1
    phase_source_key: observation.tau_ext_unthresholded
    windowed_lowdim_feature_groups:
      tau_ext:
        source_key: observation.tau_ext_unthresholded
    wrench_filter:
      # The saved online bundle already applies causal 3 Hz physics filtering.
      # Keep continuous measured torque without an additional 2 Hz post-filter.
      enabled: false
      source_key: observation.tau_ext_unthresholded
      timestamp_key: timestamp

logging:
  name: ${name}
  tags: [xarm, 25hz, clean, tau-ext, joint-position, dual-camera, image-query, lstm2]
  group: xarm_clean_25hz_tau_ext

hydra:
  run:
    dir: ${output_dir}
