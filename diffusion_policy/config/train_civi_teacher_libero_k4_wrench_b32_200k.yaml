# Fine-tune a warm-started CIVI teacher on LIBERO K4 using measured 6D wrench.
name: train_civi_teacher_libero_k4_wrench_b32_200k
exp_name: ${name}
_target_: diffusion_policy.workspace.train_force_aware_diffusion_workspace.TrainForceAwareDiffusionWorkspace
output_dir: /home/lcy/code/civi/model_output/2026.11.24/libero_k4_close_bottom_open_top_wrench_b32_200k/teacher
dataset_path: /home/lcy/code/civi/data/libero_k4_close_bottom_open_top_20hz_lerobot_v3
dino_model_path: /home/lcy/code/civi/model/model/dinov3-vitb16-pretrain-lvd1689m
task_name: libero_k4_close_bottom_open_top_wrench

shape_meta:
  obs:
    side: {shape: [3, 224, 224], type: rgb}
    wrist: {shape: [3, 224, 224], type: rgb}
    wrench: {shape: [20, 6], type: low_dim}
  action: {shape: [7]}

horizon: 9
wrench_history_steps: 20
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
free_threshold: 8.0
contact_threshold: 8.0
contact_norm: l2

phase_resampling:
  enabled: true
  precontact_seconds: 0.0
  weights: {free: 1.0, precontact: 0.0, contact: 5.0}

freeze_dino_backbone: true
freeze_modules: []

policy:
  _target_: diffusion_policy.policy.force_aware_diffusion_transformer_policy.ForceAwareDiffusionTransformerPolicy
  shape_meta: ${shape_meta}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: epsilon
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  wrench_key: wrench
  phase_wrench_key: wrench
  future_phase_wrench_key: null
  precontact_seconds: null
  relative_pose_actions: false
  action_reference_key: action_reference
  action_representation: ee_pose_delta
  num_inference_steps: 8
  dino_model_name_or_path: ${dino_model_path}
  dino_local_files_only: true
  freeze_dino_backbone: ${freeze_dino_backbone}
  freeze_modules: ${freeze_modules}
  wrench_history_steps: ${wrench_history_steps}
  force_temporal_encoder: lstm
  force_encoder_layers: 2
  pre_cross_self_attn_layers: 0
  cross_attn_query: image
  cross_attn_layers: 2
  cross_attn_query_residual: true
  camera_attention_mode: joint
  n_emb: 256
  n_head: 4
  n_layer: 8
  n_cond_layers: 1
  p_drop_emb: 0.0
  p_drop_attn: 0.1
  causal_attn: false
  free_threshold: ${free_threshold}
  contact_threshold: ${contact_threshold}
  contact_enter_frames: 5
  contact_exit_frames: 5
  contact_force_dims: [0, 1, 2]
  contact_history_reducer: last
  contact_norm: ${contact_norm}
  input_gate_enabled: false
  input_gate_threshold: 8.0
  input_gate_norm: l2
  preserve_zero_wrench: true
  fusion_gate_mode: current_contact
  image_blur_schedule: null
  image_mask_scope: current_contact
  mask_schedule:
    schedule_type: piecewise
    total_steps: ${training.num_optimizer_steps}
    piecewise_fractions: [0.0, 0.25, 0.75, 1.0]
    piecewise_probabilities: [1.0, 1.0, 0.0, 0.0]
    piecewise_interpolation: linear

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 32
  num_workers: 16
  shuffle: true
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
val_dataloader:
  batch_size: 32
  num_workers: 16
  shuffle: false
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

optimizer:
  learning_rate: 0.0001
  action_expert_weight_decay: 0.001
  fusion_weight_decay: 0.000001
  betas: [0.9, 0.95]

training:
  device: cuda:0
  seed: 42
  debug: false
  resume: false
  amp: {enabled: true, dtype: bfloat16, allow_tf32: true}
  distributed:
    enabled: false
    backend: nccl
    batch_size_is_global: true
    find_unused_parameters: false
    run_rank0_eval: false
    timeout_seconds: 86400
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: null
  num_optimizer_steps: 200000
  gradient_accumulate_every: 1
  max_grad_norm: 1.0
  use_ema: true
  rollout_every: 100
  checkpoint_every: 2000
  checkpoint_every_optimizer_steps: 10000
  validation_start_optimizer_step: 0
  val_epoch_every: 10
  val_every: 10
  sample_every: 10
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: nero_force_aware_diffusion
  resume: false
  mode: disabled
  name: ${name}
  tags: [civi, libero, k4_close_bottom_open_top, measured_wrench, history20, init_from_huanggua, phase_1_5]
  id: null
  group: libero_k4_close_bottom_open_top_wrench
  enable_plots: true
  plot_interval_sec: 10.0

checkpoint:
  topk:
    monitor_key: val_action_mse_raw
    mode: min
    k: 3
    format_str: optimizer_step={optimizer_step:08d}-val_action_mse={val_action_mse_raw:.8f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false
  action_mse:
    enabled: false
    every_optimizer_steps: 10000
    episode_selection: all
    seed: 42
    batch_size: 32

task:
  name: ${task_name}
  wrench_key: wrench
  phase_wrench_key: wrench
  future_phase_wrench_key: null
  wrench_history_steps: ${wrench_history_steps}
  phase_wrench_steps: ${wrench_history_steps}
  phase_wrench_stride: 1
  free_threshold: ${free_threshold}
  contact_threshold: ${contact_threshold}
  contact_enter_frames: 5
  contact_exit_frames: 5
  contact_force_dims: [0, 1, 2]
  contact_history_reducer: last
  contact_norm: ${contact_norm}
  phase_source_key: observation.wrench
  input_gate_enabled: false
  action_representation: ee_pose_delta
  relative_pose_actions: false
  action_reference_key: action_reference
  image_shape: [3, 224, 224]
  shape_meta: ${shape_meta}
  env_runner: null
  normalizer: {mode: gaussian, last_n_dims: 1}
  dataset:
    _target_: diffusion_policy.dataset.lerobot_v3_dataset.LeRobotV3ImageDataset
    shape_meta: ${shape_meta}
    dataset_path: ${dataset_path}
    horizon: ${horizon}
    pad_before: 1
    pad_after: 0
    n_obs_steps: ${n_obs_steps}
    n_latency_steps: ${n_latency_steps}
    seed: 42
    val_ratio: 0.1
    window_sampling_strategy: timestamp
    image_feature_map: {side: observation.images.side, wrist: observation.images.wrist}
    windowed_lowdim_feature_groups:
      wrench:
        source_key: observation.wrench
        steps: ${wrench_history_steps}
        start_offset: ${eval:'1 - ${wrench_history_steps}'}
        stride: 1
        pad_mode: zero
    action_feature_fields: [action]
    action_feature_columns: null
    action_feature_offsets: null
    action_layout: per_step
    relative_pose_actions: false
    timestamp_key: timestamp
    timestamp_step_sec: 0.05
    timestamp_tolerance_sec: null
    observation_validity_key: null
    wrench_filter: {enabled: false, source_key: observation.wrench, timestamp_key: timestamp}
    wrench_threshold: {enabled: false, source_key: observation.wrench, threshold: 8.0, norm: l2}
    local_files_only: true
    video_backend: pyav
    video_decode_device: cuda:0
    preload_images: true
    load_result_add: ram
    image_cache_dtype: uint8
    image_cache_chunk_frames: 64
    phase_resampling_enabled: ${phase_resampling.enabled}
    phase_label_mode: current_wrench
    phase_source_key: observation.wrench
    contact_threshold: ${contact_threshold}
    contact_enter_frames: 5
    contact_exit_frames: 5
    contact_force_dims: [0, 1, 2]
    contact_norm: ${contact_norm}
    precontact_seconds: ${phase_resampling.precontact_seconds}
    image_randomer_config:
      shared_across_sequence: true
      resize: false
      random_crop: false
      rotation: false
      color_jitter: true
      color_jitter_params: {brightness: 0.1, contrast: 0.15, saturation: 0.1, hue: 0.03}

hydra:
  run:
    dir: ${output_dir}
  job:
    chdir: false
