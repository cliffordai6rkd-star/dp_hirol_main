defaults:
  - libero_wm_insert_usb_force_aware
  - _self_

name: libero_open_top_drawer_put_bowl_20hz_force_aware

# Both cameras and states are recorded at 20 Hz; one source row is 50 ms.
future_wrench_start_offset: 1
future_wrench_stride: 1

dataset:
  timestamp_step_sec: 0.05
  windowed_lowdim_feature_groups:
    future_wrench:
      offsets_sec: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40]
