name: wipe_board_force_aware

# Every shape_meta.obs entry with type: rgb is encoded as a camera.
wrench_key: tau_ext
tau_ext_source_key: observation.tau_ext
wrench_history_steps: &wrench_history_steps 4
input_gate_threshold: 0.6
input_gate_norm: l1
input_gate_enabled: true
contact_threshold: 0.0
contact_force_dims: [0, 1, 2, 3, 4, 5, 6]
contact_history_reducer: max
relative_pose_actions: false
action_reference_key: action_reference

image_shape: &image_shape [3, 192, 256]
shape_meta: &shape_meta
  obs:
    wrist:
      shape: *image_shape
      type: rgb
    side:
      shape: *image_shape
      type: rgb
    tau_ext:
      shape: [*wrench_history_steps, 7]
      type: low_dim
  action:
    shape: [7]

env_runner: null

normalizer:
  mode: gaussian
  last_n_dims: 1

dataset:
  _target_: diffusion_policy.dataset.hirol_lerobot_v3_dataset.HirolLeRobotV3Dataset
  shape_meta: *shape_meta
  dataset_path: ${dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: 0
  n_obs_steps: ${n_obs_steps}
  seed: ${training.seed}
  val_ratio: 0.1
  max_train_episodes: null
  window_sampling_strategy: idx
  image_feature_map:
    wrist: observation.images.wrist
    side: observation.images.side
  lowdim_feature_groups:
    tau_ext:
      - ${task.tau_ext_source_key}
  action_feature_fields:
    - action.ee_pose
  action_layout: per_step
  relative_pose_actions: ${task.relative_pose_actions}
  action_reference_key: ${task.action_reference_key}
  timestamp_key: timestamp
  timestamp_step_sec: 0.04
  timestamp_tolerance_sec: null
  local_files_only: true
  preload_images: true
  load_result_add: ram

  image_randomer_config:
    resize: false
    random_crop: false
    rotation: false
    color_jitter: true
    color_jitter_params:
      brightness: 0.1
      contrast: 0.15
      saturation: 0.1
      hue: 0.03
