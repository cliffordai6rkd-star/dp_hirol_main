# Formal direct-torque RGB student. No inherited response/180k teacher config.
name: train_civi_student_dit_minimal
_target_: diffusion_policy.workspace.train_civi_student_dit_workspace.TrainCiviStudentDiTWorkspace
output_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_civi_dit_minimal
teacher:
  checkpoint: data/outputs/2026.11.15/final/teacher/checkpoints/optimizer_step=00150000-val_action_mse=0.00514941.ckpt
  file_sha256: 33d59938df0092a010a37d20076b1512c6a284f0dd0197460b6f94a8b9d266fa
  state_key: ema_model
  state_sha256: 2ea7da45c0fe179994c610e8742fbf9582a6e6247dab8c5469b71b00714e76bd
  step: 150000
  adapter: data/diagnostics/civi_student_iteration/final150k_match/matched/adapter/best_adapter.pt
  adapter_sha256: 118fefc3905af5ca50fb11abb2ef3b8e92e223b258f7640ee4c68c162e8b558a
  condition: data/diagnostics/civi_student_iteration/final150k_match/matched/condition/best.pt
  condition_sha256: 246214c6671b58c652be5f8a9042f7f7cca66b13fcc0660a3893404d1e07603b
  matched_teacher_file_sha256: 9221fef56a297c4fd8d37bac6491f73ae77e161d4f034c7f13fbf90f76ede799

data:
  dataset_path: data/board_25hz_3cam_lerobotv3_clean_ma5_l1_12p5
  reference_inputs: data/diagnostics/civi_student_iteration/final150k_match/matched/inputs
  split_manifest: data/diagnostics/civi_student_iteration/final150k_match/matched/episode_split.json
  decoded_rgb: data/diagnostics/2026.11.15/student_dual_path_ablation/decoded_cuda
  cache_directory: data/cache/civi_dit_minimal_v1
  phase_counts: [2, 2, 4] # global Mixed batch, episode-balanced within phase
  free_weight: 1.0
  num_workers: 0 # measured default; spawn/persistent workers supported
  prefetch_factor: 2
  pin_memory: true

render_net:
  architecture_version: 2
  image_encoder: cnn
  wrench_encoder: lstm
  image_self_attn_layers: 6
  cross_attn_layers: 2
  decoder_layers: 3
  patch_size: 8
  embed_dim: 128
  num_heads: 4
  mlp_ratio: 4.0
  dropout: 0.0
  base_channels: 32
  conv_block: bottleneck
  conditioning_dim: 256
  wrench_layers: 2
  wrench_dropout: 0.0
  wrench_history_steps: 8
  max_obs_steps: 2
  image_keys: [side, wrist]
  rendering_mode: residual
  initialize_wrench_from_teacher: true
  residual_scale: 1.0
  rgb_epsilon: 0.1
  separate_gate_path: true
  spatial_modulation: {enabled: false}
  dual_path: {enabled: false}
  context_adapter: {enabled: false} # frozen training-only adapter is owned separately
  condition_prediction: {enabled: true, hidden_dim: 64}
  condition_backbone:
    image_self_attn_layers: 1
    cross_attn_layers: 1
    decoder_layers: 0
    patch_size: 16
    embed_dim: 128
    num_heads: 4
    mlp_ratio: 2.0
    dropout: 0.0
    base_channels: 16
    conv_block: bottleneck
  high_attention_render:
    enabled: true
    source: context
    selection: soft
    activation: sigmoid
    initial_strength: 0.1
    threshold: 0.2
    detach_for_rgb: true

# Stages 1/2 reuse verified frozen snapshots. The legacy workspace retains
# Adapter-only / Condition-only calibration for explicitly new dependencies.
stages: {adapter: verified_snapshot, condition: verified_snapshot, current: rgb}
distillation:
  objective: denoiser_mse
  kd_weight: 1.0
  token_loss_weight: 0.0
  response_loss_weight: 0.0
  direction_loss_weight: 0.0
  feature_difference_loss_weight: 0.0
  demo_loss_weight: 0.0
optimizer: {lr: 0.0002, weight_decay: 0.0001, betas: [0.9, 0.999], foreach: true}
ema: {update_after_step: 0, inv_gamma: 1.0, power: 0.75, min_value: 0.0, max_value: 0.999}
training:
  seed: 42
  device: cuda:0
  max_steps: 80 # safe smoke default, total run optimizer steps; never an implicit 100k
  microbatch: 2
  global_batch: 8
  max_grad_norm: 1.0
  log_every: 10
  save_every: 20
  resume_from: null
  warm_start_from: null
  warm_start_state: online
  amp: {enabled: true, renderer: true, visual: false, dit: false, dtype: bfloat16, allow_tf32: false}
  compile: {renderer: false, visual: true, dit_teacher: false, dit_student: false, backend: inductor, mode: default}
  distributed: {enabled: true, backend: nccl, timeout_seconds: 86400}
  early_stopping: {patience: 10, min_delta: 0.0}
  cache_only: false
  profile_steps: 3
budget:
  ledger_root: data/diagnostics/civi_student_iteration
  maximum_new_updates: 100 # all smoke/benchmark runs together use a shared reservation
  task_id: civi_dit_minimal_v1
validation:
  every: 500
  encode_batch: 2 # fixed across target, student, baseline and all reference evaluations
  probes: 1
  seed: 42
  retained_episodes: [5, 26]
  full_action_every: 500
  shuffled_every: 500
  max_samples: null # smoke may explicitly bound; report labels it as incomplete
hydra:
  run: {dir: '${output_dir}'}
  job: {chdir: false}
