# Pixel RGB/intensity prediction supervised by interpolated teacher patch context effects.
defaults:
  - train_distill_render_net
  - _self_

name: train_distill_render_net_patch_context
teacher_checkpoint: data/outputs/2026.11.01/22.57.02_091072_dp_distill_pipeline/teacher/checkpoints/optimizer_step=00180000.ckpt

distillation:
  objective: denoiser_mse
  token_loss_weight: 0.0 # Selected: token MSE is diagnostic only.
  demo_loss_weight: 0.0

render_net:
  rendering_mode: residual
  residual_scale: 1.0 # Selected: RGB-channel change is bounded by predicted strength.
  high_attention_render:
    enabled: true
    source: context
    selection: soft
    activation: sigmoid
    initial_strength: 0.1
    threshold: 0.0
    baseline: raw_zero
    normalization: image_minmax
    strength_scale: null

teacher_cache:
  precision: float32
  dtype: float16 # Storage precision; paired context-effect computation remains FP32.

dataloader:
  batch_size: 32

val_dataloader:
  batch_size: 32

optimizer:
  lr: 0.0003

hydra:
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_distill_patch_context
