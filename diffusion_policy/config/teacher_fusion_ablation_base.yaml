defaults:
  - train_civi_teacher
  - _self_

name: teacher_fusion_ablation
dataset_path: data/board_25hz_3cam_lerobotv3_clean_ma5_l1_12p5
ablation:
  seed: 42
  optimizer_steps: 5000
  validation_every: 500
  log_every: 50
  train_episodes: 20
  validation_episodes: 5
  action_sampling_steps: 8

policy:
  obs_encoder:
    _target_: diffusion_policy.model.vision.teacher_fusion_ablation.TeacherFusionAblationEncoder
    fusion_mode: baseline
    pretrained_model_name_or_path: ${dino_model_path}
    n_emb: ${policy.n_emb}
    n_head: ${policy.n_head}
    max_obs_steps: ${n_obs_steps}
    wrench_dim: 7
    wrench_history_steps: 8
    force_temporal_encoder: lstm
    force_encoder_layers: 2
    dropout: ${policy.p_drop_attn}
    freeze_backbone: true
    local_files_only: true
    image_keys: [side, wrist]
    image_shapes:
      side: [3, 224, 224]
      wrist: [3, 224, 224]
    camera_attention_mode: joint
    pre_cross_self_attn_layers: 0
    cross_attn_layers: 2
    cross_attn_query: image
    cross_attn_query_residual: true
  image_blur_scope: precontact_contact
  image_blur_schedule:
    total_steps: ${ablation.optimizer_steps}
    start_sigma: 5.0
    end_sigma: 0.0
    start_fraction: 0.3333333333333333
    end_fraction: 1.0

task:
  dataset:
    val_ratio: 0.08064516129032258  # Exactly 5 of the current 62 episodes.
    max_train_episodes: ${ablation.train_episodes}

dataloader:
  batch_size: 16
  num_workers: 4
val_dataloader:
  batch_size: 16
  num_workers: 0
training:
  distributed:
    enabled: false
  num_epochs: null
  num_optimizer_steps: ${ablation.optimizer_steps}
  resume: false
  lr_warmup_steps: 250
logging:
  mode: disabled
