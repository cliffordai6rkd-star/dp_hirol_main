defaults:
  - _self_
  - task@task: insert_usb

name: train_dp_baseline_insert_usb
_target_: diffusion_policy.workspace.train_dp_baseline_workspace.TrainDPBaselineWorkspace

dataset_path: ${oc.env:DP_BASELINE_DATASET_PATH}

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: ${name}

horizon: 9
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}

policy:
  _target_: diffusion_policy.policy.diffusion_transformer_image_policy.DiffusionTransformerImagePolicy
  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: epsilon

  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: IMAGENET1K_V1
    resize_shape: [224, 224]
    crop_shape: null
    random_crop: false
    use_group_norm: false
    share_rgb_model: true
    imagenet_norm: true

  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 8
  n_layer: 8
  n_cond_layers: 1
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.1
  causal_attn: false
  # action.joint is seven joint coordinates, not xyz+xyzw.
  normalize_pose_quaternions: false

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

val_dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: false
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

optimizer:
  learning_rate: 1.0e-4
  action_expert_weight_decay: 1.0e-3
  fusion_weight_decay: 1.0e-6
  betas: [0.9, 0.95]

training:
  device: cuda:0
  seed: 42
  debug: false
  resume: true
  amp:
    enabled: true
    dtype: bfloat16
    allow_tf32: true
  distributed:
    enabled: false
    backend: nccl
    batch_size_is_global: true
    find_unused_parameters: false
    # DDP skips rank-0 offline rollout/sample work so other ranks do not idle.
    run_rank0_eval: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 2500
  num_optimizer_steps: null
  gradient_accumulate_every: 1
  max_grad_norm: 1.0
  use_ema: true
  rollout_every: 20
  checkpoint_every: 500
  # In step-based mode, keep only the final K checkpoints for real-robot
  # evaluation. checkpoint_every is ignored while this is set.
  checkpoint_every_optimizer_steps: null
  val_every: 10
  sample_every: 10
  max_train_steps: null
  max_val_steps: 50
  tqdm_interval_sec: 1.0

logging:
  project: nero_dp_baseline
  resume: true
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: [dp-baseline, pure-visual, dual-camera, imagenet-resnet18, transformer]
  id: null
  group: null

checkpoint:
  topk:
    # Keep the final K checkpoints by optimizer step, rather than ranking by a
    # validation metric. This is useful for selecting policies on the real robot.
    monitor_key: null
    mode: min
    k: 3
    format_str: optimizer_step={optimizer_step:08d}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false

hydra:
  job:
    override_dirname: ${name}_${task_name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
