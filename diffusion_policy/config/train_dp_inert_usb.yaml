defaults:
  - _self_
  - task@task: insert_usb

name: train_dp_baseline_insert_usb
_target_: diffusion_policy.workspace.train_dp_baseline_workspace.TrainDPBaselineWorkspace

dataset_path: ${oc.env:DP_BASELINE_DATASET_PATH}
dino_model_path: ${oc.env:DINOV3_MODEL_PATH}

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: ${name}

horizon: 9
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}

policy:
  _target_: diffusion_policy.policy.diffusion_transformer_image_policy.DiffusionTransformerImagePolicy
  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: epsilon

  obs_encoder:
    _target_: diffusion_policy.model.vision.dinov3_multi_image_obs_encoder.DINOv3MultiImageObsEncoder
    shape_meta: ${shape_meta}
    pretrained_model_name_or_path: ${dino_model_path}
    output_dim: 256
    freeze_backbone: true
    local_files_only: true
    pooling: cls

  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 8
  n_layer: 8
  n_cond_layers: 1
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.1
  causal_attn: false

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 512
  num_workers: 16
  shuffle: true
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

val_dataloader:
  batch_size: 8
  num_workers: 2
  shuffle: false
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

optimizer:
  learning_rate: 1.0e-4
  action_expert_weight_decay: 1.0e-3
  fusion_weight_decay: 1.0e-6
  betas: [0.9, 0.95]

training:
  device: cuda:0
  seed: 42
  debug: false
  resume: true
  amp:
    enabled: true
    dtype: bfloat16
    allow_tf32: true
  distributed:
    enabled: true
    backend: nccl
    batch_size_is_global: true
    find_unused_parameters: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: null
  num_optimizer_steps: 150000
  gradient_accumulate_every: 1
  max_grad_norm: 1.0
  use_ema: true
  rollout_every: 20
  checkpoint_every: 20
  checkpoint_every_optimizer_steps: null
  val_every: 5
  sample_every: 10
  max_train_steps: null
  max_val_steps: 50
  tqdm_interval_sec: 1.0

logging:
  project: nero_dp_baseline
  resume: true
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: [dp-baseline, pure-visual, dual-camera, dinov3, transformer]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: val_action_mse
    mode: min
    k: 2
    format_str: optimizer_step={optimizer_step:08d}-val_action_mse={val_action_mse:.6f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false

hydra:
  job:
    override_dirname: ${name}_${task_name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
