name: train_distill_render_net
_target_: diffusion_policy.workspace.train_distill_render_net_workspace.TrainDistillRenderNetWorkspace
teacher_checkpoint: data/outputs/2026.10.20/21.54.27_train_dp_image_query_lstm_insert_usb_insert_usb_force_aware/checkpoints/best.ckpt

# Stage 2 follows completed FDP training: freeze the teacher and train only RenderNet.
distillation:
  objective: denoiser_mse # token_mse restores the previous context-matching objective.
  token_loss_weight: 0.0 # Diagnostic only: the first experiment uses denoiser + context-strength supervision.
  demo_loss_weight: 0.0 # Optional original diffusion objective against demonstration actions.
  validation_seed: 42 # Repeat the same noisy-action probes for checkpoint selection.

# Complete both train/validation caches before any optimizer update.
# Cache raw patch effects/attention independently of the intensity mapping.
teacher_cache:
  enabled: true
  cleanup_on_exit: true # Delete this run's teacher targets on completion, errors and stop signals.
  dtype: float16 # Context storage/transfer only; losses remain float32.
  precision: model # float32 computes both comparison groups' teacher targets without AMP.
  directory: data/cache/render_net_teacher
  batch_size: 8
  num_workers: 4
  load_into_ram: false # Read teacher targets from SSD via mmap; keep RGB preloaded in RAM.
  only: false # To retain a precomputed cache, also set cleanup_on_exit=false.

render_net:
  architecture_version: 2
  backbone: transformer # CNN + image/wrench attention; unet omits image self-attention.
  rendering_mode: patch_residual # Per-token 3x16x16 RGB residual; gaussian_glow remains an ablation.
  patch_residual_refine: true # Small identity-initialized 3x3 RGB residual refinement across patch seams.
  base_channels: 16
  conv_block: bottleneck # Narrow spatial convolutions in the image encoder.
  initialize_wrench_from_teacher: true
  conditioning_dim: 256 # Resolved from teacher when initialization is enabled.
  wrench_history_steps: 8 # Resolved from the teacher, as are observation steps and camera keys.
  max_obs_steps: 2
  wrench_layers: 1
  wrench_dropout: 0.0
  image_keys: [side, wrist]
  residual_scale: 1.0 # Maximum absolute per-channel RGB change before strength modulation and clipping.
  # Retained for gaussian_glow ablations; patch_residual does not use these values.
  glow:
    num_blobs: 8
    sigma_min: 0.03 # Gaussian radii in normalized image coordinates.
    sigma_max: 0.20
    max_intensity: 1.0
    initial_intensity: 0.05 # Weak positive light keeps geometry gradients available at initialization.
  transformer:
    patch_size: 16 # CNN downsampling factor; power of two, >= 2.
    embed_dim: 128
    depth: 4
    num_heads: 4
    mlp_ratio: 4.0
    dropout: 0.0
  high_attention_render:
    enabled: true
    source: context # context is the continuous wrench-effect strength field.
    selection: soft # Continuous region gate; binary_top_percentile remains available for ablations.
    activation: relu # Negative logits represent exact zero rendering strength.
    strength_scale: 5.0 # Absolute context effect scale: strength=D_Z/(D_Z+scale); zero stays zero.
    percentile: 90.0 # Used only by context + binary_top_percentile.
    prediction_threshold: 0.5 # Binary student gate may be empty when all scores are low.
    baseline: raw_zero # Reference used for context supervision.
    # Used by noise_attention; context uses this legacy ramp only when strength_scale is null.
    percentiles: [80.0, 99.0]
    # The selected teacher source supervises a student intensity head; rendering needs no teacher.
    mask_loss_weight: 1.0
    teacher_seed: 42

# Inherit the teacher's dataset class/windows; hold out student validation episodes independently.
# Set val_ratio=0 to train on all episodes without validation/early stopping.
# Keep RGB identical on teacher and student paths, and use the saved normalizer.
dataset:
  val_ratio: 0.1 # Episode split for student early stopping, even if the teacher used all episodes.
  video_backend: null
  video_decode_device: cuda:0
  preload_images: true
  image_randomer_config: null
  # preload_wrench: true
  load_result_add: ram
  image_cache_dtype: uint8

dataloader:
  batch_size: 32
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true

val_dataloader:
  batch_size: 64
  shuffle: false
  pin_memory: true
  persistent_workers: true

optimizer:
  lr: 0.0003
  weight_decay: 0.0001
  betas: [0.9, 0.999]

logging:
  progress_bar: true # tqdm for decoding/teacher caching, training and validation
  progress_bar_non_tty: false # Redirected logs contain periodic summaries instead of carriage-return bars.
  tqdm_interval_sec: 1.0
  tqdm_leave: false # Keep one live train/validation line, then print the epoch summary.
  status_interval_sec: 60.0 # Plain-text heartbeat when no live progress bar is shown.
  plot_every_steps: 100 # also save after initial validation and each epoch; 0 = epoch only

training:
  seed: 42
  device: cuda:0
  resume_from: null # Restore a single-GPU or DDP checkpoint, including optimizer and epoch.
  distributed:
    enabled: false # Launch with torchrun and set true; one complete model replica per GPU.
    backend: nccl
    batch_size_is_global: true # Four GPUs split batch_size=32 into 8 samples each.
    find_unused_parameters: false
    timeout_seconds: 86400 # Rank 0 may need hours to prepare teacher targets before training.
  num_epochs: 1000
  # Optional step cap for smoke tests; normal training is limited by epochs.
  max_steps: null
  max_grad_norm: 1.0
  log_every: 10 # Legacy compatibility only; terminal updates now use logging.* intervals.
  # Validate the entire validation split after every epoch.
  max_val_batches: null
  early_stopping:
    enabled: true
    patience: 30
    min_delta: 0.0001 # Require meaningful improvement in validation denoiser MSE.
  amp:
    enabled: true
    dtype: bfloat16
    allow_tf32: true
  compile:
    enabled: true # CUDA training only; validation/cache generation use eager execution.
    render_backbone: true # Keep the complete LSTM sequence outside compilation.
    student_dino: true # Preserve gradients from frozen DINO back to rendered RGB.
    backend: inductor
    mode: default # First training batch compiles; a new batch/image shape may recompile.

hydra:
  job_logging:
    formatters:
      concise:
        format: '%(asctime)s %(levelname).1s | %(message)s'
        datefmt: '%H:%M:%S'
    handlers:
      console:
        formatter: concise
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_distill_render_net
  job:
    chdir: false
