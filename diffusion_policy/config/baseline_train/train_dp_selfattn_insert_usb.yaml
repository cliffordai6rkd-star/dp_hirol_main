# @package _global_
defaults:
  - /train_dp_insert_usb_force_aware
  - _self_

name: train_dp_selfattn_insert_usb

# Project and concatenate both cameras' patch tokens with raw future-wrench
# tokens, then run joint self-attention. No GRU, contact gate or prefix fill.
policy:
  _target_: diffusion_policy.policy.dino_token_baseline_policy.DinoTokenBaselinePolicy
  baseline_mode: self_attn
  baseline_self_attn_layers: 1
  force_temporal_encoder: none
  force_encoder_layers: 0
  camera_attention_mode: joint
  mask_schedule:
    schedule_type: constant
    start_probability: 0.0
    end_probability: 0.0

logging:
  tags: [baseline, dinov3, self-attention, future-wrench, dual-camera, ee-pose]
