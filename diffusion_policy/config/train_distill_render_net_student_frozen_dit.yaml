# RenderNet -> frozen DINO/adapter/context_norm -> frozen DiT.
defaults:
  - train_distill_render_net_student_response_adapter
  - _self_

name: train_distill_render_net_student_frozen_dit
output_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_frozen_dit_region02/student

distillation:
  objective: denoiser_mse
  response_loss_weight: 0.0
  token_loss_weight: 0.0
  demo_loss_weight: 0.0

render_net:
  high_attention_render:
    threshold: 0.2

dataloader:
  num_workers: 8

val_dataloader:
  num_workers: 4
  persistent_workers: true

training:
  # Load EMA weights only, enter RGB, and start a new optimization run.
  # Leave null to train adapter/conditions before RGB from scratch.
  warm_start_from: null
  sample_phases: null # Optional anchor-phase sample selection: 0=free, 1=pre-contact, 2=contact.
  early_stopping:
    patience: 10

logging:
  progress_bar: false
  status_interval_sec: 30.0
