defaults:
  - sim_force_aware_dp_train_20hz_lstm2_gripper
  - _self_

name: sim_force_aware_dp_train_20hz_lstm2_gripper_local_highres

# Independent ablation: retain full-frame DINOv3 and add a higher-resolution
# wrist crop CNN. Its gated residual is fused back into the existing 12x16
# wrist patch grid, so the DiT context length stays unchanged.
policy:
  local_highres:
    enabled: true
    camera_key: wrist
    # [top, left, height, width], normalized to the wrist image.
    crop: [0.25, 0.25, 0.5, 0.5]
    resize: [192, 256]
    channels: [32, 64, 128]
    gate_init: -2.0

logging:
  group: libero_20hz_lstm2_gripper_local_highres
  tags: [libero, 20hz, force-aware, future-wrench, dinov3, local-highres, wrist-cnn, gripper]
