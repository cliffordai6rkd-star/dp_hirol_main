# @package _global_
# Experiment 2: DINO -> one image-only SA layer -> all image tokens to DiT.
defaults:
  - /baseline_train/train_dp_self_crossattn_insert_usb
  - _self_

name: train_dp_image_selfattn_insert_usb

policy:
  _target_: diffusion_policy.policy.dino_token_baseline_policy.DinoTokenBaselinePolicy
  baseline_mode: image_self_attn
  baseline_self_attn_layers: 1
  # Wrench labels remain in the dataset for shared splits/resampling but are
  # never read by this model. SA spans both cameras within each observation.
  force_temporal_encoder: none
  force_encoder_layers: 0
  pre_cross_self_attn_layers: 0
  cross_attn_layers: 0
  camera_attention_mode: joint
  mask_schedule:
    schedule_type: constant
    start_probability: 0.0
    end_probability: 0.0

dataloader:
  batch_size: 64
val_dataloader:
  batch_size: 64

training:
  resume: false
  num_epochs: null
  num_optimizer_steps: 200000
  checkpoint_every_optimizer_steps: 20000
  max_val_steps: null

checkpoint:
  topk:
    monitor_key: val_action_mse_raw
    mode: min
    k: 2
    format_str: optimizer_step={optimizer_step:08d}-val_action_mse={val_action_mse_raw:.6f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false

logging:
  group: insert_usb_abulation_study
  tags: [ablation, dinov3, image-only, self-attention, dual-camera]
